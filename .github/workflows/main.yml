name: Backend Job

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (if applicable)
        run: npm ci || true

      - name: Execute Script with Injected Private Key
        env:
          # Injects the GitHub Secret safely as an environment variable
          PRIVATE_KEY: ${{ secrets.BACKEND_APP_PK }}
        run: node index.js
