name: Run Script

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This enables the manual "Run workflow" button!

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run my JS script
        env:
          BACKEND_APP_PK: ${{ secrets.BACKEND_APP_PK }}
          CLIENTID: ${{ vars.CLIENTID }}
          AUDIENCEURL: ${{ vars.AUDIENCEURL }}
        run: node js/backend-app.js

      - name: Request Access Token
        env:
          TOKEN_ENDPOINT: ${{ vars.AUDIENCEURL }} 
        run: |
          echo "Requesting access token from $TOKEN_ENDPOINT..."
          
          # Make the POST request and save the response into a variable
          HTTP_RESPONSE=$(curl -s -X POST "$TOKEN_ENDPOINT" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
            -d "client_assertion=${{ env.CLIENT_ASSERTION }}")
          
          # Print the response to the GitHub Actions console
          echo "Authorization Server Response:"
          echo "$HTTP_RESPONSE"

          #  Parse the JSON and extract the access_token field using jq
          # The -r flag tells jq to output raw text instead of a JSON string with quotes
          EXTRACTED_TOKEN=$(echo "$HTTP_RESPONSE" | jq -r '.access_token')
          
          # Safety check: Ensure the token isn't null or empty before proceeding
          if [ "$EXTRACTED_TOKEN" == "null" ] || [ -z "$EXTRACTED_TOKEN" ]; then
            echo "CRITICAL ERROR: Failed to extract access token! Check the server response above."
            exit 1
          fi
          
          # Save it to the GitHub Environment for the next workflow steps
          echo "ACCESS_TOKEN=$EXTRACTED_TOKEN" >> $GITHUB_ENV
          echo "Access token successfully extracted and saved to environment!"

          - name: Call FHIR API
        run: |
          echo "Making authenticated request to FHIR server..."
          
          # Make a GET request using the extracted token in the Authorization header
          curl -s -X GET "https://your-fhir-server.com/Patient" \
            -H "Authorization: Bearer ${{ env.ACCESS_TOKEN }}" \
            -H "Accept: application/json"
